<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AKAL Creator | Creator marketing you can actually measure</title>
    <meta name="description" content="Managed creator marketing for B2B SaaS and AI tools. We source, negotiate, contract, and pay creators — and track every placement to real clicks and signups. 20% of creator budget, month to month." />
    <meta name="author" content="Akal Digital Services Ltd" />

    <!-- The AKAL mark: Didone A with the red crossbar. Small sizes carry an
         optically thickened bar so the brand detail survives downscaling. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Self-hosted. No external font hosts. -->
    <link rel="preload" href="/fonts/Satoshi-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Satoshi-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/CommitMono-400.woff2" as="font" type="font/woff2" crossorigin />

    <meta property="og:title" content="AKAL Creator | Creator marketing you can actually measure" />
    <meta property="og:description" content="Managed creator marketing for B2B SaaS and AI tools. Every placement tracked to real clicks and signups." />
    <meta property="og:type" content="website" />

    <!-- No share image: this site ships no imagery, and a broken og:image is
         worse than none. Change only when a real card asset exists. -->
    <meta name="twitter:card" content="summary" />
  </head>
